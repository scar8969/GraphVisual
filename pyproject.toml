[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kgraph"
version = "1.1.0"
description = "PDF → knowledge graph: entity resolution, typed relations, citations, interactive explorer."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Priyanshu Rout", email = "priyanshurout8969@gmail.com" }]
keywords = ["knowledge-graph", "nlp", "pdf", "ner", "networkx", "visualization"]
dependencies = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
    "networkx>=3.0",
    "pdfplumber>=0.10",
    "pypdf>=3.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3", "pdf2image>=1.16"]
spacy = ["spacy>=3.7", "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.7.1/en_core_web_sm-3.7.1-py3-none-any.whl"]
test = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.24", "pyflakes>=3.0"]

[project.scripts]
kgraph = "kgraph.cli:main"

[tool.setuptools.packages.find]
include = ["kgraph*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
